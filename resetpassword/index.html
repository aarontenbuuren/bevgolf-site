<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Reset Password — BGA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      /* The app's launch colour (splash background, blueGreen 500), so the page
         reads as the same brand as the app it came from. */
      background: #86dbd1;
    }
    body {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .wrap {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .brand {
      display: block;
      width: 132px;
      height: auto;
    }
    .card {
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: 32px 28px;
      /* Tinted with the brand's darkest green: a black shadow at the old
         strength turned muddy on the light background. */
      box-shadow: 0 12px 40px rgba(18, 83, 75, 0.22);
    }
    .state {
      display: none;
      flex-direction: column;
      gap: 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.3px;
    }
    .subtitle {
      font-size: 14px;
      color: #64748b;
      line-height: 1.5;
      margin-top: -12px;
    }
    .fields { display: flex; flex-direction: column; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding-left: 4px;
    }
    input[type=password] {
      background: #f5f7fa;
      border: 1.5px solid #e2e8f0;
      border-radius: 50px;
      height: 52px;
      padding: 0 20px;
      font-size: 16px;
      color: #0f172a;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    input[type=password]:focus { border-color: #10c8b8; }
    .error-msg {
      font-size: 13px;
      color: #ef4444;
      padding-left: 4px;
      display: none;
    }
    .btn {
      background: #10b8a8;
      color: #fff;
      border: none;
      border-radius: 50px;
      height: 52px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:disabled { opacity: 0.35; cursor: default; }
    .return-link {
      background: #10b8a8;
      color: #fff;
      text-decoration: none;
      border-radius: 50px;
      height: 52px;
      font-size: 16px;
      font-weight: 700;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon { font-size: 44px; text-align: center; }
    .center { text-align: center; }
    .muted { font-size: 14px; color: #64748b; line-height: 1.6; }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #10c8b8;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 8px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="wrap">
  <img class="brand" src="/assets/bga-logo.png" alt="BGA" width="132" height="60">
  <div class="card">

    <div id="loading" class="state" style="align-items:center;">
      <div class="spinner"></div>
    </div>

    <div id="form" class="state">
      <h1>New Password</h1>
      <p class="subtitle">Choose a strong password for your account.</p>
      <div class="fields">
        <div class="field">
          <label>New Password</label>
          <input type="password" id="pw" placeholder="Min. 8 characters" autocomplete="new-password" />
        </div>
        <div class="field">
          <label>Confirm Password</label>
          <input type="password" id="cf" placeholder="Repeat password" autocomplete="new-password" />
        </div>
      </div>
      <div id="form-err" class="error-msg"></div>
      <button class="btn" id="submit-btn" disabled>Continue</button>
    </div>

    <div id="success" class="state" style="align-items:center;">
      <div class="icon">&#10003;</div>
      <h1 class="center">Password Updated</h1>
      <p class="muted center">You're all set. Head back to the BGA app and sign in with your new password.</p>
      <a href="bgaapp://" class="return-link">Return to BGA App</a>
    </div>

    <div id="expired" class="state" style="align-items:center;">
      <div class="icon">&#128274;</div>
      <h1 class="center">Link Expired</h1>
      <p id="expired-msg" class="muted center">This reset link is invalid or has expired. Please request a new one from the BGA app.</p>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const { createClient } = window.supabase;
const client = createClient(
  'https://bnkuwvxpyvukrseuznwf.supabase.co',
  'sb_publishable_QwC4WxPteI2hRxS0HnCY-w_Ped8U-vl'
);

const states = ['loading', 'form', 'success', 'expired'];
function show(id) {
  states.forEach(s => {
    document.getElementById(s).style.display = s === id ? 'flex' : 'none';
  });
}

function setFormError(msg) {
  const el = document.getElementById('form-err');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

const pwEl = document.getElementById('pw');
const cfEl = document.getElementById('cf');
const btn  = document.getElementById('submit-btn');

function checkReady() {
  btn.disabled = pwEl.value.length === 0 || cfEl.value.length === 0;
}
pwEl.addEventListener('input', checkReady);
cfEl.addEventListener('input', checkReady);

btn.addEventListener('click', async () => {
  const pw = pwEl.value;
  const cf = cfEl.value;
  if (pw.length < 8) { setFormError('Password must be at least 8 characters.'); return; }
  if (pw !== cf) { setFormError('Passwords do not match.'); return; }
  setFormError('');
  btn.disabled = true;
  btn.textContent = 'Updating…';
  const { error } = await client.auth.updateUser({ password: pw });
  if (error) {
    setFormError(error.message);
    btn.disabled = false;
    btn.textContent = 'Continue';
  } else {
    show('success');
  }
});

(async () => {
  show('loading');

  const hash  = new URLSearchParams(window.location.hash.slice(1));
  const token = hash.get('access_token');
  const refresh = hash.get('refresh_token') ?? '';
  const type  = hash.get('type');

  if (!token || type !== 'recovery') {
    document.getElementById('expired-msg').textContent =
      'This reset link is invalid or has expired. Please request a new one from the BGA app.';
    show('expired');
    return;
  }

  const { error } = await client.auth.setSession({ access_token: token, refresh_token: refresh });
  if (error) {
    document.getElementById('expired-msg').textContent =
      'This reset link has expired. Please request a new one from the BGA app.';
    show('expired');
    return;
  }

  show('form');
})();
</script>
</body>
</html>
